name: upitrack
description: Tracks payments from every UPI app using bank SMS and statements, on the device.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # File picking for statement import.
  file_picker: '>=8.1.0 <11.0.0'
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.0
  permission_handler: ^12.0.0
  sqflite: ^2.4.0
  # PDF text extraction (also opens password-protected statements).
  # Free under the Syncfusion Community License for individuals and small
  # companies; see README.
  syncfusion_flutter_pdf: '>=29.1.33 <40.0.0'
  share_plus: ^12.0.2
  http: ^1.6.0
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.1
  cryptography: ^2.9.0
  flutter_secure_storage: ^10.3.4
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
