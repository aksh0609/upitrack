name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Tests + Android APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test

      - name: Set up release signing (skipped when the secrets are absent)
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: flutter build apk --release --dart-define=BUILD_TIME=$(git log -1 --format=%ct)

      - uses: actions/upload-artifact@v4
        with:
          name: upitrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Compiles the app without signing; the Release workflow signs it for
      # TestFlight when the Apple secrets exist (see README).
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      # Sideloadable with the user's own Apple ID (README → Get it on iPhone).
      - name: Package the unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry ../upitrack-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: upitrack-ipa-unsigned
          path: build/ios/upitrack-unsigned.ipa

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Served from https://aksh0609.github.io/upitrack/, hence the base href.
      - name: Build web
        run: flutter build web --release --base-href /upitrack/

      - uses: actions/upload-artifact@v4
        with:
          name: upitrack-web
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    name: Deploy web to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    # One deploy at a time, never cancelled half-way (GitHub's Pages starter workflow does the same).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
