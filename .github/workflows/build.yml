name: Test and build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fills in any standard Flutter Android files that aren't in the repo
      # (Gradle scripts, icons, themes). Existing files are never overwritten,
      # so our AndroidManifest.xml and MainActivity.kt are kept.
      - name: Generate missing platform files
        run: flutter create --platforms=android --org com.piyush --project-name upitrack .

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: upitrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk
