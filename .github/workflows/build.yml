name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Tests + Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fills in standard Flutter platform files that aren't in the repo
      # (Gradle scripts, icons, themes). Existing files are never
      # overwritten, so our AndroidManifest.xml and MainActivity.kt are kept.
      - name: Generate missing platform files
        run: flutter create --platforms=android --org com.piyush --project-name upitrack .

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: upitrack-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS build check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate missing platform files
        run: flutter create --platforms=ios --org com.piyush --project-name upitrack .

      - name: Add the Shortcuts action to the Xcode project
        run: |
          gem list -i xcodeproj > /dev/null || sudo gem install xcodeproj --no-document
          ruby scripts/setup_ios.rb

      - run: flutter pub get

      # Compiles the app without signing. Installing on a phone needs your
      # own Apple signing (see README).
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign
